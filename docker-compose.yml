services:
  postgres:
    image: postgres:15-alpine
    container_name: personal-homepage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: homepage
      POSTGRES_PASSWORD: homepage_password
      POSTGRES_DB: homepage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepage"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-homepage-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://homepage:homepage_password@postgres:5432/homepage
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-this-in-production
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./prisma:/app/prisma

volumes:
  postgres_data:


